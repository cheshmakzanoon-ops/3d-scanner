// gradle -I tools/dependencies/export.gradle :app:exportDependencyInventory --write-locks --write-verification-metadata sha256
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
allprojects { project ->
    project.configurations.configureEach { configuration ->
        if (configuration.name in ['releaseRuntimeClasspath','releaseCompileClasspath','kspReleaseKotlinProcessorClasspath']) {
            configuration.resolutionStrategy.activateDependencyLocking()
        }
    }
    project.afterEvaluate {
        if (project.path == ':app') {
            project.tasks.register('exportDependencyInventory') {
                doLast {
                    def inventory = []
                    ['releaseRuntimeClasspath','releaseCompileClasspath','kspReleaseKotlinProcessorClasspath'].each { name ->
                        def configuration=project.configurations.findByName(name)
                        if (configuration != null && configuration.canBeResolved) {
                            def modules=configuration.incoming.resolutionResult.allComponents.collect { c ->
                                c.id instanceof ModuleComponentIdentifier ? c.id.group+':'+c.id.module+':'+c.id.version : null
                            }.findAll { it != null }.sort()
                            def artifacts=configuration.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                                def id=artifact.moduleVersion.id
                                [coordinate: id.group+':'+id.name+':'+id.version, name:artifact.file.name,
                                 path:artifact.file.absolutePath, sha256:java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
                            }.sort { a,b -> a.coordinate <=> b.coordinate ?: a.name <=> b.name }
                            inventory << [configuration:name,modules:modules,artifacts:artifacts]
                        }
                    }
                    def output=project.rootProject.file(System.getenv('RF_DEPENDENCY_EXPORT') ?: 'build/dependencies/resolved.json')
                    output.parentFile.mkdirs();output.text=JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion:1,configurations:inventory]))+'\n'
                }
            }
        }
    }
}
