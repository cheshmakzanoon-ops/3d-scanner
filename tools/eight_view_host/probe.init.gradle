import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.security.MessageDigest
import java.util.zip.ZipFile
// Exact AGP-generated resource configuration relocation; no resource disabling.
class EightViewAgpResources {
 static final String CONFIG='com/android/tools/test_config.properties'
 static final List PATH_KEYS=['android_resource_apk','android_merged_assets','android_merged_manifest']
 static final List KEYS=PATH_KEYS+['android_custom_package']
 static final long MAX_BYTES=512L*1024*1024
 static String digest(byte[] bytes) { MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
 static void canonical(File file,boolean directory) {
  def a=java.nio.file.Files.readAttributes(file.toPath(),java.nio.file.attribute.BasicFileAttributes,java.nio.file.LinkOption.NOFOLLOW_LINKS)
  assert !a.isSymbolicLink() && (directory?a.isDirectory():a.isRegularFile()) && file.canonicalPath==file.absoluteFile.toPath().normalize().toString() : 'AGP resource alias/type/missing'
 }
 static Map fileIdentity(File file,long maximum=MAX_BYTES) {
  canonical(file,false);def before=java.nio.file.Files.readAttributes(file.toPath(),java.nio.file.attribute.BasicFileAttributes,java.nio.file.LinkOption.NOFOLLOW_LINKS)
  assert before.isRegularFile() && !before.isSymbolicLink()
  assert before.size()<=maximum : 'AGP resource file limit'
  def hash=MessageDigest.getInstance('SHA-256');long count=0
  java.nio.file.Files.newByteChannel(file.toPath(),[java.nio.file.StandardOpenOption.READ,java.nio.file.LinkOption.NOFOLLOW_LINKS] as Set).withCloseable { channel ->
   def input=java.nio.channels.Channels.newInputStream(channel);byte[] buffer=new byte[65536];int n
   while((n=input.read(buffer))!=-1) {count+=n;assert count<=maximum;hash.update(buffer,0,n)}
  }
  def after=java.nio.file.Files.readAttributes(file.toPath(),java.nio.file.attribute.BasicFileAttributes,java.nio.file.LinkOption.NOFOLLOW_LINKS)
  canonical(file,false);assert after.isRegularFile() && !after.isSymbolicLink()
  assert before.size()==count && after.size()==count && before.fileKey()==after.fileKey() && before.lastModifiedTime()==after.lastModifiedTime() : 'AGP resource changed during read'
  [path:file.canonicalPath,bytes:count,sha256:hash.digest().encodeHex().toString()]
 }
 static Map treeRecord(File root) {
  canonical(root,true);def files=[];def directories=[];def observations=[:];long total=0;int count=0
  java.nio.file.Files.walkFileTree(root.toPath(),new java.nio.file.SimpleFileVisitor<java.nio.file.Path>() {
   @Override java.nio.file.FileVisitResult preVisitDirectory(java.nio.file.Path p,java.nio.file.attribute.BasicFileAttributes a) {
    assert ++count<=100000;canonical(p.toFile(),true);directories<<p.toString()
    observations[p]=[a.fileKey(),a.lastModifiedTime()];java.nio.file.FileVisitResult.CONTINUE
   }
   @Override java.nio.file.FileVisitResult postVisitDirectory(java.nio.file.Path p,IOException error) {
    if(error!=null) throw error
    canonical(p.toFile(),true);def a=java.nio.file.Files.readAttributes(p,java.nio.file.attribute.BasicFileAttributes)
    assert observations[p]==[a.fileKey(),a.lastModifiedTime()] : 'AGP resource directory changed during read'
    java.nio.file.FileVisitResult.CONTINUE
   }
   @Override java.nio.file.FileVisitResult visitFile(java.nio.file.Path p,java.nio.file.attribute.BasicFileAttributes a) {
    assert ++count<=100000;def record=fileIdentity(p.toFile());total+=record.bytes;assert total<=MAX_BYTES
    files<<record;java.nio.file.FileVisitResult.CONTINUE
   }
  })
  observations.each {p,before ->
   canonical(p.toFile(),true);def a=java.nio.file.Files.readAttributes(p,java.nio.file.attribute.BasicFileAttributes)
   assert before==[a.fileKey(),a.lastModifiedTime()] : 'AGP resource directory drift'
  }
  [files:files.sort {it.path},directories:directories.sort()]
 }
 static List tree(File root) {treeRecord(root).files}
 static Map values(File original) {
  def identity=fileIdentity(original,65536);def buffer=new ByteArrayOutputStream()
  java.nio.file.Files.newByteChannel(original.toPath(),[java.nio.file.StandardOpenOption.READ,java.nio.file.LinkOption.NOFOLLOW_LINKS] as Set).withCloseable { channel ->
   def input=java.nio.channels.Channels.newInputStream(channel);byte[] block=new byte[4096];int n
   while((n=input.read(block))!=-1) {assert buffer.size()+n<=65536 : 'AGP config grew during read';buffer.write(block,0,n)}
  }
  byte[] bytes=buffer.toByteArray();assert fileIdentity(original,65536)==identity
  assert digest(bytes)==identity.sha256 : 'AGP config changed while parsing'
  def props=[:]
  new String(bytes,'ISO-8859-1').readLines().each { line ->
   if(!line) return
   if(line.startsWith('#')) {assert line=='#Generated by the Android Gradle plugin' : 'Unexpected AGP config comment';return}
   assert line==~ /[a-z_]+=[A-Za-z0-9_\.\/-]+/ : 'Unsupported AGP properties encoding/value'
   def pair=line.split('=',2);assert !props.containsKey(pair[0]) : 'Duplicate AGP property';props[pair[0]]=pair[1]
  }
  assert props.keySet()==KEYS.toSet() : 'Unexpected AGP configuration fields'
  assert props.android_custom_package==~ /[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+/ : 'AGP package name differs'
  PATH_KEYS.each { key ->
   String value=props[key];assert !value.startsWith('/') && value.split('/',-1).every {it && !(it in ['.','..'])} : 'Unsafe AGP relative resource path'
  }
  [identity:identity,properties:props,raw:bytes]
 }
 static void writeConfig(File target,byte[] bytes) {
  assert bytes.length<=65536 : 'Derived AGP config byte limit';canonical(target.parentFile,true)
  if(java.nio.file.Files.exists(target.toPath(),java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
   assert fileIdentity(target,65536).sha256==digest(bytes) : 'Derived AGP config changed'
  } else java.nio.file.Files.write(target.toPath(),bytes,java.nio.file.StandardOpenOption.CREATE_NEW)
 }
 static Map project(List originalCp,File projectDir,File build,File work,File configDir,Map declared,Map expected,Map producers) {
  canonical(projectDir,true);canonical(build,true);canonical(work,true);canonical(configDir,true)
  assert build.canonicalFile==new File(projectDir,'build').canonicalFile && build.absolutePath==new File(projectDir,'build').absolutePath
  File config=new File(configDir,CONFIG);def parsed=values(config)
  assert parsed.properties==expected : 'AGP generated config differs from actual task inputs'
  assert tree(configDir)==[parsed.identity] : 'AGP configuration directory has additional content'
  assert configDir.toPath().startsWith(build.toPath()) : 'AGP config outside selected build'
  def matches=[]
  originalCp.eachWithIndex { File entry,int index ->
   if(entry.isDirectory()) {
    if(new File(entry,CONFIG).exists()) {canonical(entry,true);assert entry.canonicalFile==configDir.canonicalFile;matches<<index}
   } else if(entry.isFile()) {
    assert entry.name.endsWith('.jar');new ZipFile(entry).withCloseable { zip ->
     assert zip.size()<=100000;assert !zip.entries().any {it.name==CONFIG} : 'Duplicate JAR AGP configuration'
    }
   }
  }
  assert matches.size()==1 : 'Missing/duplicate AGP configuration slot'
  def resources=[];def properties=[:]+parsed.properties;long total=0;int count=0
  PATH_KEYS.each { key ->
   File file=declared[key];assert file!=null
   File resolved=new File(projectDir,parsed.properties[key]);boolean directory=key=='android_merged_assets'
   canonical(file,directory);assert resolved.absoluteFile.toPath().normalize()==file.toPath() && file.toPath().startsWith(build.toPath()) : 'AGP resource differs from declared output'
   def snapshot=directory?treeRecord(file):[files:[fileIdentity(file)],directories:[]]
   def files=snapshot.files
   files.each {total+=it.bytes;count++};count+=snapshot.directories.size();assert total<=MAX_BYTES && count<=100000
   resources<<[key:key,kind:directory?'directory':'file',path:file.canonicalPath,producer:producers[key],files:files,directories:snapshot.directories]
   properties[key]=file.canonicalPath
  }
  File derivedDir=new File(work,'agp-test-config');File derived=new File(derivedDir,CONFIG)
  derived.parentFile.mkdirs();canonical(derived.parentFile,true)
  byte[] bytes=KEYS.collect {key -> key+'='+properties[key]+'\n'}.join('').getBytes('ISO-8859-1')
  assert bytes.length<=65536 && properties.values().every {it==~ /[A-Za-z0-9_\.\/-]+/} : 'Unsupported absolute AGP property encoding'
  writeConfig(derived,bytes)
  File retained=new File(work,'agp-original-test-config.properties');writeConfig(retained,parsed.raw)
  assert fileIdentity(config)==parsed.identity && fileIdentity(retained).sha256==parsed.identity.sha256 && tree(configDir)==[parsed.identity] : 'AGP original configuration drift'
  assert tree(derivedDir)==[fileIdentity(derived)] : 'Unexpected derived AGP config content'
  resources.each {resource ->
   File file=new File(resource.path);def current=resource.kind=='directory'?treeRecord(file):[files:[fileIdentity(file)],directories:[]]
   assert current==[files:resource.files,directories:resource.directories] : 'AGP resource drift during projection'
  }
  def cp=new ArrayList(originalCp);cp[matches[0]]=derivedDir
  def ledger=[schema:1,index:matches[0],projectDirectory:projectDir.canonicalPath,
    producer:[task:':app:generateDebugUnitTestConfig',taskType:'com.android.build.gradle.tasks.GenerateTestConfig',outputProperty:'outputDirectory'],
    originalDirectory:configDir.canonicalPath,original:parsed.identity,originalValues:parsed.properties,
    retainedOriginal:fileIdentity(retained),derivedDirectory:derivedDir.canonicalPath,derived:fileIdentity(derived),properties:properties,resources:resources]
  [cp:cp,ledger:ledger]
 }
}
// Bounded, content-defined normalization. No runtime owner/adapter policy changes.
class EightViewProviderArchives {
 static final long RAW_LIMIT=512L*1024*1024, ENTRY_LIMIT=16L*1024*1024
 static String digest(byte[] value) { MessageDigest.getInstance('SHA-256').digest(value).encodeHex().toString() }
 static Map identity(File file) {
  assert file.isFile() && !java.nio.file.Files.isSymbolicLink(file.toPath()) && file.canonicalPath==file.absoluteFile.toPath().normalize().toString() : 'Provider alias/missing file'
  def before=java.nio.file.Files.readAttributes(file.toPath(),java.nio.file.attribute.BasicFileAttributes)
  assert before.size() in 1..RAW_LIMIT : 'Provider raw byte limit'
  def hash=MessageDigest.getInstance('SHA-256');long total=0
  file.withInputStream { input -> byte[] buffer=new byte[65536];int n
   while((n=input.read(buffer))!=-1) { total+=n;assert total<=RAW_LIMIT;hash.update(buffer,0,n) }
  }
  def after=java.nio.file.Files.readAttributes(file.toPath(),java.nio.file.attribute.BasicFileAttributes)
  assert before.size()==total && after.size()==total && before.lastModifiedTime()==after.lastModifiedTime() && before.fileKey()==after.fileKey() : 'Provider changed during read'
  [path:file.canonicalPath,bytes:(int)total,sha256:hash.digest().encodeHex().toString()]
 }
 static void safeName(String name) {
  assert name && name.length()<=4096 && !name.startsWith('/') && !name.contains('\\') && !name.contains(':') && name.toCharArray().every { ((int)it)>=32 && ((int)it)<=126 } : 'Unsafe ZIP name'
  String path=name.endsWith('/')?name.substring(0,name.length()-1):name
  assert path && path.split('/',-1).every { it && !(it in ['.','..']) } : 'Unsafe ZIP path'
 }
 static byte[] readEntry(ZipFile zip, java.util.zip.ZipEntry entry) {
  assert entry.size>=0 && entry.size<=ENTRY_LIMIT : 'ZIP entry byte limit'
  def out=new ByteArrayOutputStream()
  zip.getInputStream(entry).withCloseable { input -> byte[] buffer=new byte[65536];int n
   while((n=input.read(buffer))!=-1) { assert out.size()+n<=ENTRY_LIMIT;out.write(buffer,0,n) }
  }
  assert out.size()==entry.size : 'ZIP entry size changed'
  out.toByteArray()
 }
 static void centralDirectory(File file) {
  // ZipFile does not expose Unix external attributes. Read only bounded headers,
  // never extract paths; ZIP64/multi-disk/symlink/special entries are unsupported.
  new RandomAccessFile(file,'r').withCloseable { input ->
   int length=(int)Math.min(input.length(),65557L);byte[] tail=new byte[length]
   input.seek(input.length()-length);input.readFully(tail)
   def end=java.nio.ByteBuffer.wrap(tail).order(java.nio.ByteOrder.LITTLE_ENDIAN);int offset=-1
   for(int i=length-22;i>=0;i--) if(end.getInt(i)==0x06054b50 && i+22+(end.getShort(i+20)&0xffff)==length) { offset=i;break }
   assert offset>=0 : 'ZIP end record missing'
   assert end.getShort(offset+4)==0 && end.getShort(offset+6)==0 : 'Multi-disk ZIP unsupported'
   int count=end.getShort(offset+10)&0xffff
   assert count<=2000 && count==(end.getShort(offset+8)&0xffff) : 'ZIP64/count unsupported'
   long size=end.getInt(offset+12)&0xffffffffL;long start=end.getInt(offset+16)&0xffffffffL
   assert start!=0xffffffffL && size!=0xffffffffL && start+size==input.length()-length+offset : 'ZIP64/central directory layout unsupported'
   input.seek(start)
   for(int i=0;i<count;i++) {
    byte[] bytes=new byte[46];input.readFully(bytes)
    def header=java.nio.ByteBuffer.wrap(bytes).order(java.nio.ByteOrder.LITTLE_ENDIAN)
    assert header.getInt(0)==0x02014b50 : 'Invalid ZIP central header'
    int flags=header.getShort(8)&0xffff;int method=header.getShort(10)&0xffff
    assert (flags&~0x80e)==0 && method in [0,8] && header.getShort(34)==0 : 'Encrypted/unsupported ZIP entry'
    int type=(int)((header.getInt(38)>>>16)&0xf000)
    assert type in [0,0x8000,0x4000] : 'ZIP symlink/special entry'
    int name=header.getShort(28)&0xffff;int extra=header.getShort(30)&0xffff;int comment=header.getShort(32)&0xffff
    assert name in 1..4096 && input.filePointer+name+extra+comment<=start+size : 'ZIP header bounds'
    assert [20,24,42].every { (header.getInt(it)&0xffffffffL)!=0xffffffffL } : 'ZIP64 entry unsupported'
    byte[] rawName=new byte[name];input.readFully(rawName)
    assert type==0 || (type==0x4000)==(rawName[name-1]==(byte)47) : 'ZIP directory type/name mismatch'
    byte[] extraBytes=new byte[extra];input.readFully(extraBytes)
    def fields=java.nio.ByteBuffer.wrap(extraBytes).order(java.nio.ByteOrder.LITTLE_ENDIAN);int position=0
    while(position<extra) {
     assert position+4<=extra : 'ZIP extra field header'
     int tag=fields.getShort(position)&0xffff;int fieldSize=fields.getShort(position+2)&0xffff
     assert tag!=1 && position+4+fieldSize<=extra : 'ZIP64/invalid extra field'
     position+=4+fieldSize
    }
    input.seek(input.filePointer+comment)
   }
   assert input.filePointer==start+size : 'ZIP central entry count differs'
  }
 }
 static Map archive(File file) {
  def before=identity(file);centralDirectory(file);def entries=[];def names=[] as Set;long expanded=0
  new ZipFile(file).withCloseable { zip -> zip.entries().each { entry ->
   assert entries.size()<2000 : 'ZIP entry count limit';safeName(entry.name)
   assert names.add(entry.name) : 'Duplicate ZIP entry'
   String upper=entry.name.toUpperCase(Locale.ROOT)
   assert !upper.startsWith('META-INF/VERSIONS/') && !(upper.startsWith('META-INF/') && (upper.endsWith('.SF') || upper.endsWith('.RSA') || upper.endsWith('.DSA') || upper.endsWith('.EC') || upper.tokenize('/').last().startsWith('SIG-'))) : 'Unsupported signed/multi-release archive'
   byte[] bytes=readEntry(zip,entry);expanded+=bytes.length;assert expanded<=RAW_LIMIT : 'ZIP expanded byte limit'
   assert !entry.directory || bytes.length==0 : 'Directory ZIP entry payload'
   if(upper=='META-INF/MANIFEST.MF') {
    def manifest=new java.util.jar.Manifest(new ByteArrayInputStream(bytes))
    assert manifest.entries.isEmpty() && manifest.mainAttributes.keySet().every { it.toString().toLowerCase(Locale.ROOT) in ['manifest-version','created-by','build-jdk','built-by'] } : 'Unsupported loader-affecting manifest'
   }
   entries<<[name:entry.name,directory:entry.directory,bytes:bytes.length,sha256:digest(bytes)]
  } }
  assert identity(file)==before : 'Archive changed during inspection'
  def classes=entries.findAll { !it.directory && it.name.endsWith('.class') }
  def resources=entries.findAll { it.directory || !it.name.endsWith('.class') }
  before+[entries:entries,
   classMapSha256:digest(classes.sort { it.name }.collect { it.sha256+'  '+it.name+'\n' }.join('').getBytes('UTF-8')),
   resourceMapSha256:digest(resources.collect { (it.directory?'d':'f')+' '+it.sha256+' '+it.bytes+' '+it.name+'\n' }.join('').getBytes('UTF-8'))]
 }
 static List classes(Map record) { record.entries.findAll { !it.directory && it.name.endsWith('.class') }.sort { it.name } }
 static List resources(Map record) { record.entries.findAll { it.directory || !it.name.endsWith('.class') } }
 static void immutableWrite(File target,byte[] bytes) {
  assert bytes.length<=ENTRY_LIMIT : 'Derived archive byte limit'
  if(target.exists()) { assert identity(target).sha256==digest(bytes) : 'Derived archive changed' }
  else java.nio.file.Files.write(target.toPath(),bytes,java.nio.file.StandardOpenOption.CREATE_NEW)
 }
 static Map extract(File aar,File classes,String expectedSha) {
  def before=identity(aar);centralDirectory(aar);assert before.sha256==expectedSha : 'Source OpenCV AAR differs from pinned policy'
  byte[] extracted;def names=[] as Set;int count=0
  new ZipFile(aar).withCloseable { zip -> zip.entries().each { entry ->
   assert ++count<=2000 : 'AAR entry count limit';safeName(entry.name);assert names.add(entry.name) : 'Duplicate AAR entry'
   if(entry.name=='classes.jar') { assert !entry.directory;extracted=readEntry(zip,entry) }
  } }
  assert extracted!=null && identity(aar)==before : 'AAR classes missing/changed'
  immutableWrite(classes,extracted);before
 }
 static Map projectResources(File source,Map expected,File target) {
  def output=new ByteArrayOutputStream()
  new java.util.zip.ZipOutputStream(output).withCloseable { result ->
   new ZipFile(source).withCloseable { zip -> resources(expected).each { entry ->
    def original=zip.getEntry(entry.name);assert original!=null
    byte[] bytes=readEntry(zip,original);assert digest(bytes)==entry.sha256 && bytes.length==entry.bytes && original.directory==entry.directory : 'Projection source entry changed'
    def projected=new java.util.zip.ZipEntry(entry.name);projected.setTime(0L)
    result.putNextEntry(projected);result.write(bytes);result.closeEntry()
    assert output.size()<=ENTRY_LIMIT : 'Projection byte limit'
   } }
  }
  assert archive(source)==expected : 'Projection source changed'
  immutableWrite(target,output.toByteArray())
  def projected=archive(target)
  assert projected.entries==resources(expected) && classes(projected).isEmpty() : 'Projection resource identity/order differs'
  projected
 }
 static Map normalize(List<File> original,List<File> providers,File aar,Map aarIdentity,File sourceClasses,File output) {
  def source=archive(sourceClasses);def originals=providers.collect { file -> archive(file)+[index:original.indexOf(file)] }
  assert originals.size() in [1,2] : 'One equivalent provider or exact AGP two-role pair required'
  originals.each { assert classes(it)==classes(source) : 'OpenCV transformed provider differs' }
  assert originals.collect { it.path }.toSet().size()==originals.size() : 'Provider aliases'
  if(originals.size()==2) assert !java.nio.file.Files.isSameFile(new File(originals[0].path).toPath(),new File(originals[1].path).toPath()) : 'Hardlinked provider aliases'
  def cp=new ArrayList(original);def projection=null;String mode
  if(originals.size()==1) {
   def only=originals[0]
   assert resources(only)==resources(source) || resources(only).every { it.directory } : 'Single-provider resources differ'
   only.role=resources(only)==resources(source)?'single-source-resources-identical':'single-class-only-no-resource-completeness';mode='single-class-equivalent-provider'
  } else {
   def sourceRoles=originals.findAll { it.sha256==source.sha256 && it.bytes==source.bytes }
   assert sourceRoles.size()==1 : 'Ambiguous source-AAR resource role'
   def resourceRole=sourceRoles[0];def runtime=originals.find { it.path!=resourceRole.path }
   assert resources(runtime).every { it.directory } : 'Runtime class role has non-class payload'
   assert runtime.index<resourceRole.index : 'Unsupported reversed AGP roles'
   runtime.role='runtime-classes';resourceRole.role='aar-resources'
   projection=projectResources(new File(resourceRole.path),resourceRole.findAll { k,v -> !(k in ['index','role']) },new File(output,'opencv-resources-only.jar'))+[index:resourceRole.index,sourcePath:resourceRole.path]
   cp[resourceRole.index]=new File(projection.path);mode='agp-two-role-resource-projection'
  }
  assert identity(aar)==aarIdentity && archive(sourceClasses)==source : 'Source binding changed during normalization'
  originals.each { record -> assert archive(new File(record.path))==record.findAll { k,v -> !(k in ['index','role']) } : 'Original provider changed during normalization' }
  [cp:cp,ledger:[schema:1,mode:mode,sourceAar:aarIdentity,sourceClasses:source,providers:originals,projection:projection]]
 }
}
// An absent classpath directory is a bound state, never an empty fabricated output.
class EightViewAbsentDirectories {
 static Map directory(java.nio.file.Path path) {
  def attrs=java.nio.file.Files.readAttributes(path,'unix:dev,ino,isDirectory,isSymbolicLink',java.nio.file.LinkOption.NOFOLLOW_LINKS)
  assert attrs.isDirectory && !attrs.isSymbolicLink : 'Absent-output ancestor is not a real directory'
  [path:path.toString(),device:Long.toUnsignedString((long)attrs.dev),inode:Long.toUnsignedString((long)attrs.ino)]
 }
 static Map proof(File buildRoot,File target) {
  def root=buildRoot.absoluteFile.toPath().normalize();def path=target.absoluteFile.toPath().normalize()
  assert root.toString()==buildRoot.canonicalPath && path.toString()==target.canonicalPath && path.startsWith(root) && path!=root : 'Absent-output root/path alias'
  assert path.nameCount+1<=64 : 'Absent-output path depth'
  def ancestors=[];def current=path.root;ancestors<<directory(current);def missing=null
  for(def component:path) {
   def next=current.resolve(component)
   try { ancestors<<directory(next);current=next }
   catch(java.nio.file.NoSuchFileException absent) {
    assert current.startsWith(root) : 'Build root must exist before absence admission'
    int count=0
    java.nio.file.Files.newDirectoryStream(current).withCloseable { listing ->
     for(def child:listing) {
      assert ++count<=100000 : 'Absent-output parent listing bound'
      assert child.fileName.toString()!=component.toString() : 'Absent output appeared during listing'
     }
    }
    missing=next;break
   }
  }
  assert missing!=null : 'Declared absent output appeared'
  ancestors.each { previous -> assert directory(java.nio.file.Paths.get(previous.path))==previous : 'Absent-output ancestor identity changed' }
  boolean stillAbsent=false
  try { java.nio.file.Files.readAttributes(missing,java.nio.file.attribute.BasicFileAttributes,java.nio.file.LinkOption.NOFOLLOW_LINKS) }
  catch(java.nio.file.NoSuchFileException absent) { stillAbsent=true }
  assert stillAbsent : 'Absent output appeared during proof'
  [schema:1,root:root.toString(),ancestors:ancestors,firstMissing:missing.toString()]
 }
}
// Closed source-selected experiments. No caller-defined selectors or thresholds.
class HostSparseExperiment {
 static Map select(Map cfg) {
  def profiles=[
   'eight-cuboid':[type:'EightViewSparsePrefixHostTest',method:'fixedEightPhotosPersistSparseOrRecordUnmodifiedProductionFailure'],
   'relief-three':[type:'ReliefThreeSparsePrefixHostTest',method:'fixedThreePhotosPersistSparseOrRecordUnmodifiedProductionFailure']]
  assert cfg.experiment instanceof String && profiles.containsKey(cfg.experiment) : 'Unknown closed experiment profile'
  def selected=profiles[cfg.experiment]
  def selector='com.realityforge.scanner.hostintegration.'+selected.type+'.'+selected.method
  assert cfg.selector==selector : 'Mixed experiment selector'
  [selector:selector,include:'**/'+selected.type+'.class']
 }
}
// Additive task only. Original source sets/gates are unchanged after this invocation.
allprojects { afterEvaluate { if (path == ':app') {
 def cfg = new JsonSlurper().parse(new File(project.property('eightConfig').toString()))
 def experiment=HostSparseExperiment.select(cfg)
 def sha = { byte[] b -> MessageDigest.getInstance('SHA-256').digest(b).encodeHex().toString() }
 def writeJson = { File f, Object x -> f.parentFile.mkdirs(); f.text=JsonOutput.prettyPrint(JsonOutput.toJson(x))+'\n' }

 def sourceDir=new File(cfg.sources); assert sourceDir.isDirectory()
 android.sourceSets.test.java.srcDir(sourceDir)
 // Android and host test tasks are registered by later afterEvaluate callbacks.
 // Keep source-set setup above in project evaluation, but resolve tasks only once
 // every project has finished evaluation. Missing tasks still fail explicitly.
 // Keep providers unrealized here: projectsEvaluated has no project state lock.
 // Host task creation traverses configuration-backed ordinary dependencies.
 gradle.projectsEvaluated {
 def ordinaryProvider=tasks.named('testDebugUnitTest')
 def hostProvider=tasks.named('hostIntegrationTest')
 def output=new File(cfg.work)
 def prepared=new File(output,'prepared.json')
 def ownerNames=['org.opencv.android.OpenCVLoader','org.opencv.android.StaticHelper','org.opencv.core.Core','org.opencv.core.Mat','com.realityforge.scanner.engine.NativeCore']
 def agpProjection = { List cp ->
  def descriptors=[
   android_resource_apk:[task:':app:packageDebugUnitTestForUnitTest',taskType:'com.android.build.gradle.internal.tasks.PackageForHostTest',outputProperty:'apkForHostTest'],
   android_merged_assets:[task:':app:mergeDebugAssets',taskType:'com.android.build.gradle.tasks.MergeSourceSetFolders',outputProperty:'outputDir'],
   android_merged_manifest:[task:':app:processDebugManifestForPackage',taskType:'com.android.build.gradle.tasks.ProcessPackagedManifestTask',outputProperty:'packageManifests']]
  def completed = { Map descriptor ->
   def task=tasks.getByName(descriptor.task.tokenize(':').last())
   assert task.class.classLoader.loadClass(descriptor.taskType).isInstance(task) : 'AGP resource producer type differs'
   assert task.enabled && gradle.taskGraph.hasTask(task) && task.state.executed && task.state.failure==null && !task.state.noSource : 'AGP resource producer did not complete'
   assert !task.state.skipped || task.state.skipMessage in ['UP-TO-DATE','FROM-CACHE'] : 'AGP resource producer arbitrary skip'
   task
  }
  def configTask=completed([task:':app:generateDebugUnitTestConfig',taskType:'com.android.build.gradle.tasks.GenerateTestConfig'])
  File configDir=configTask.outputDirectory.get().asFile
  assert configTask.projectDir.get().asFile.canonicalFile==projectDir.canonicalFile : 'AGP configuration project differs'
  assert configTask.outputs.files.files.any {it.canonicalFile==configDir.canonicalFile} : 'AGP configuration output not declared'
  def inputs=configTask.testConfigInputs
  def generated=inputs.computeProperties(projectDir)
  def expected=[android_resource_apk:generated.resourceApkFile,android_merged_assets:generated.mergedAssetsDir,
    android_merged_manifest:generated.mergedManifestDir,android_custom_package:generated.customPackage]
  def declared=[android_resource_apk:inputs.resourceApk.get().asFile,
    android_merged_assets:inputs.mergedAssets.get().asFile,
    android_merged_manifest:new File(projectDir,generated.mergedManifestDir)]
  descriptors.each { key,descriptor ->
   def task=completed(descriptor);File property=task."${descriptor.outputProperty}".get().asFile
   assert task.outputs.files.files.any {it.canonicalFile==property.canonicalFile} : 'AGP resource output not declared'
   if(key=='android_merged_manifest') {
    assert property.canonicalFile==inputs.mergedManifest.get().asFile.canonicalFile && declared[key].toPath().startsWith(property.toPath()) : 'AGP manifest producer/input differs'
   } else assert property.canonicalFile==declared[key].canonicalFile : 'AGP resource producer/input differs'
  }
  EightViewAgpResources.project(cp,projectDir,layout.buildDirectory.get().asFile,output,configDir,declared,expected,descriptors)
 }
 // Graph-time classpath discovery may precede producer execution. Wire only a
 // declared path here; mandatory preparation and before-fork captures prove bytes.
 def wireAgpProjection = { List cp ->
  def task=tasks.getByName('generateDebugUnitTestConfig')
  assert task.class.classLoader.loadClass('com.android.build.gradle.tasks.GenerateTestConfig').isInstance(task)
  File original=task.outputDirectory.get().asFile
  assert original.absoluteFile.toPath().normalize().startsWith(layout.buildDirectory.get().asFile.absoluteFile.toPath().normalize())
  def indices=[];cp.eachWithIndex { File entry,int index ->
   if(entry.absoluteFile.toPath().normalize()==original.absoluteFile.toPath().normalize()) indices<<index
  }
  assert indices.size()==1 : 'Missing/duplicate declared AGP configuration slot'
  def wired=new ArrayList(cp);wired[indices[0]]=new File(output,'agp-test-config');wired
 }
 def actualClasspath = { boolean projectResources=true ->
  def artifacts=configurations.getByName('debugRuntimeClasspath').resolvedConfiguration.resolvedArtifacts
  def cv=artifacts.findAll { it.moduleVersion.id.group=='org.opencv' && it.moduleVersion.id.name=='opencv' && it.moduleVersion.id.version=='4.12.0' }
  assert cv.size()==1 && cv[0].file.name.endsWith('.aar') : 'exact current OpenCV AAR'
  File aar=cv[0].file
  File classes=new File(output,'aar-classes.jar')
  def buildPolicy=new JsonSlurper().parse(rootProject.file('tools/eight_view_host/build-policy.json'))
  def aarIdentity=EightViewProviderArchives.extract(aar,classes,buildPolicy.opencvAarSha256)
  byte[] bytes=classes.bytes
  def expected=EightViewProviderArchives.classes(EightViewProviderArchives.archive(classes)).collectEntries { [it.name,it.sha256] }
  def original=hostProvider.get().classpath.files.toList();assert original.size()<=2000 : 'Classpath entry count limit'
  def replaced=[];def coreProviders=[:]
  def overlapsCanonicalClasses = { File file ->
   assert file.length()<=EightViewProviderArchives.RAW_LIMIT : 'Classpath JAR byte limit'
   boolean found=false
   new ZipFile(file).withCloseable { zip ->
    assert zip.size()<=100000 : 'Classpath JAR metadata count limit'
    // Discovery inspects metadata only; candidate contents use the bounded parser.
    found=zip.entries().any { expected.containsKey(it.name) }
   };found
  }
  def cp=original.collect { f ->
   if(f.isFile() && f.name.endsWith('.jar')) {
    if(overlapsCanonicalClasses(f)) {
     def content=EightViewProviderArchives.classes(EightViewProviderArchives.archive(f)).collectEntries { [it.name,it.sha256] }
     assert content==expected : 'OpenCV transformed provider differs'
     coreProviders[f]=[classCount:content.size(),coreSha256:content['org/opencv/core/Core.class'],
       classMapSha256:sha(JsonOutput.toJson(new TreeMap(content)).getBytes('UTF-8')),
       owners:ownerNames.collectEntries { name -> [name,content[name.replace('.','/')+'.class']] }]
     replaced<<f; return classes
    }
   }
   f
  }
  def normalized=null;def normalizationFailure=null
  try { normalized=EightViewProviderArchives.normalize(original,replaced,aar,aarIdentity,classes,output) }
  catch(AssertionError failure) { normalizationFailure=failure }
  catch(Exception failure) { normalizationFailure=failure }
  if(normalizationFailure!=null) {
   try {
   // Diagnostic only: never select, deduplicate, append or accept another provider.
   // Existing command-log sanitization/byte limits apply; this record is <=256 KiB.
   def pathInfo = { File f ->
    String absolute=f.absolutePath;String canonical=f.canonicalPath
    [path:absolute.take(1024),canonicalPath:canonical.take(1024),
     pathTruncated:absolute.length()>1024,canonicalPathTruncated:canonical.length()>1024,
     pathSha256:sha(absolute.getBytes('UTF-8')),canonicalPathSha256:sha(canonical.getBytes('UTF-8'))]
   }
   def fileSha = { File f ->
    def digest=MessageDigest.getInstance('SHA-256')
    f.withInputStream { stream -> byte[] buffer=new byte[65536];int n
     while((n=stream.read(buffer))!=-1) digest.update(buffer,0,n)
    };digest.digest().encodeHex().toString()
   }
   // Known matching JARs must survive a late classpath position. Directory
   // discovery is metadata-only and bounded; no extra JAR scan is performed.
   def matchingIndices=(0..<original.size()).findAll { coreProviders.containsKey(original[it]) }
   int metadataLimit=Math.min(original.size(),4096)
   def directoryIndices=(0..<metadataLimit).findAll { index ->
    File f=original[index];f.isDirectory() && new File(f,'org/opencv/core/Core.class').isFile()
   }
   def selectedIndices=(matchingIndices+directoryIndices+(0..<Math.min(original.size(),256)).toList()).unique().take(256)
   def rows=[]
   selectedIndices.each { index ->
    File f=original[index]
    def row=pathInfo(f)+[index:index,symlink:java.nio.file.Files.isSymbolicLink(f.toPath()),
      type:f.isDirectory()?'directory':f.isFile()?(f.name.endsWith('.jar')?'jar':'other-file'):'missing',
      bytes:f.isFile()?f.length():null]
    if(f.isFile() && f.name.endsWith('.jar')) {
     row.corePresent=coreProviders.containsKey(f)
     if(row.corePresent) row.putAll(coreProviders[f]+[matchesExpectedClassMap:true])
    } else if(f.isDirectory()) {
     File core=new File(f,'org/opencv/core/Core.class')
     row.corePresent=core.isFile();row.coreSymlink=java.nio.file.Files.isSymbolicLink(core.toPath())
     if(row.corePresent) {
      row.coreBytes=core.length()
      row.coreHashOmitted=row.symlink || row.coreSymlink || row.coreBytes>4*1024*1024 ||
       core.canonicalPath!=new File(f.canonicalFile,'org/opencv/core/Core.class').absolutePath
      if(!row.coreHashOmitted) row.coreSha256=fileSha(core)
     }
    } else row.corePresenceNotExamined=true
    rows<<row
   }
   def diagnostic=[schema:1,reason:'existing-opencv-provider-count',phase:cfg.phase,
     matchingJarCount:replaced.size(),classpathEntryCount:original.size(),entries:rows,
     entryOrder:'matching-jars-then-observed-directory-core-then-original-index',
     directoryMetadataEntriesExamined:metadataLimit,directoryMetadataEntriesOmitted:original.size()-metadataLimit,
     directoryCoreObservedCount:directoryIndices.size(),
     entriesOmitted:original.size()-rows.size(),truncated:original.size()>rows.size(),
     expectedAar:pathInfo(aar)+[sha256:fileSha(aar)],
     expectedClasses:[sha256:sha(bytes),classCount:expected.size(),
       coreSha256:expected['org/opencv/core/Core.class'],
       classMapSha256:sha(JsonOutput.toJson(new TreeMap(expected)).getBytes('UTF-8'))]]
   def updateOmissions = { ->
    diagnostic.matchingJarRowsOmitted=matchingIndices.size()-rows.count { matchingIndices.contains(it.index) }
    diagnostic.directoryCoreRowsOmitted=directoryIndices.size()-rows.count { directoryIndices.contains(it.index) }
   }
   updateOmissions()
   String encoded=JsonOutput.toJson(diagnostic)
   while(encoded.getBytes('UTF-8').length>250*1024 && !rows.isEmpty()) {
    rows.remove(rows.size()-1);diagnostic.entriesOmitted=original.size()-rows.size();diagnostic.truncated=true
    updateOmissions();encoded=JsonOutput.toJson(diagnostic)
   }
   println('EIGHT_VIEW_PROVIDER_DIAGNOSTIC '+encoded)
   } catch(Exception diagnosticError) {
    // A diagnostic I/O problem must not replace the original fail-closed refusal.
    println('EIGHT_VIEW_PROVIDER_DIAGNOSTIC '+JsonOutput.toJson([schema:1,
      reason:'existing-opencv-provider-count',matchingJarCount:replaced.size(),
      diagnosticIncomplete:true,errorType:diagnosticError.getClass().getName()]))
   }
  }
  if(normalizationFailure!=null) throw normalizationFailure
  cp=normalized.cp
  original.findAll { it.isDirectory() }.each { directory ->
   assert !expected.keySet().any { name -> new File(directory,name).isFile() } : 'Unclassified canonical class directory provider'
  }
  assert cp.collect {it.canonicalPath}.toSet().size()==cp.size()
  def agp=projectResources?agpProjection(cp):[cp:wireAgpProjection(cp),ledger:null]
  [cp:agp.cp,aar:aar,classes:classes,normalization:normalized.ledger,agpResources:agp.ledger]
 }
 def absentOutput = { File file ->
  File buildRoot=layout.buildDirectory.get().asFile
  assert buildRoot.canonicalPath==new File(projectDir,'build').absoluteFile.toPath().normalize().toString() : 'Only canonical app/build absence domain admitted'
  def descriptors=[
   [task:':app:kspDebugUnitTestKotlin',taskType:'com.google.devtools.ksp.gradle.KspAATask',outputProperty:'kspConfig.resourceOutputDir',relativePath:'generated/ksp/debugUnitTest/resources',admission:'completed-optional-output'],
   [task:':app:compileDebugUnitTestJavaWithJavac',taskType:'org.gradle.api.tasks.compile.JavaCompile',outputProperty:'destinationDirectory',relativePath:'intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes',admission:'java-no-source-output']]
  def matches=descriptors.findAll { new File(buildRoot,it.relativePath).absoluteFile.toPath().normalize()==file.absoluteFile.toPath().normalize() }
  assert matches.size()==1 : 'Undeclared absent classpath directory'
  def producer=matches[0];def task=tasks.getByName(producer.task.tokenize(':').last())
  assert task.class.classLoader.loadClass(producer.taskType).isInstance(task) : 'Absent-output producer type differs'
  assert task.enabled && gradle.taskGraph.hasTask(task) && task.state.executed && task.state.failure==null : 'Absent-output producer did not complete successfully'
  File declared
  if(producer.admission=='java-no-source-output') {
   assert task instanceof org.gradle.api.tasks.compile.JavaCompile && task.state.noSource : 'Absent Javac directory requires actual NO-SOURCE'
   declared=task.destinationDirectory.get().asFile
  } else {
   assert !task.state.skipped || task.state.skipMessage in ['UP-TO-DATE','FROM-CACHE','NO-SOURCE'] : 'Absent KSP directory cannot follow arbitrary skipped task'
   assert task.kspConfig.resourceOutputDir instanceof org.gradle.api.provider.Property : 'KSP resource output property missing/type differs'
   declared=task.kspConfig.resourceOutputDir.get()
  }
  assert declared.absoluteFile.toPath().normalize()==file.absoluteFile.toPath().normalize() : 'Absent-output declared property/path differs'
  assert task.outputs.files.files.any { it.absoluteFile.toPath().normalize()==file.absoluteFile.toPath().normalize() } : 'Absent-output property is not a declared task output'
  [kind:'absent-declared-directory',path:file.absoluteFile.toPath().normalize().toString(),producer:producer,absence:EightViewAbsentDirectories.proof(buildRoot,file)]
 }
 def capture = { String stage ->
  def resolved=actualClasspath();def cp=resolved.cp;def owners=[:].withDefault {[]};def inventory=[]
  cp.each { f ->
   def attributes
   try { attributes=java.nio.file.Files.readAttributes(f.toPath(),java.nio.file.attribute.BasicFileAttributes,java.nio.file.LinkOption.NOFOLLOW_LINKS) }
   catch(java.nio.file.NoSuchFileException absent) { inventory<<absentOutput(f);return }
   assert !attributes.isSymbolicLink()
   if(attributes.isDirectory()) {
    def files=project.fileTree(f).files.sort {it.absolutePath}.collect { c -> assert !java.nio.file.Files.isSymbolicLink(c.toPath()); [path:c.canonicalPath,sha256:sha(c.bytes)] }
    inventory<<[kind:'directory',path:f.canonicalPath,files:files]
    ownerNames.each { name -> File c=new File(f,name.replace('.','/')+'.class');if(c.isFile()) owners[name]<<[container:f.canonicalPath,file:c.canonicalPath,sha256:sha(c.bytes)] }
   } else {
    assert attributes.isRegularFile() && f.name.endsWith('.jar');inventory<<[kind:'jar',path:f.canonicalPath,sha256:sha(f.bytes)]
    new ZipFile(f).withCloseable { z -> ownerNames.each { name -> def e=z.getEntry(name.replace('.','/')+'.class');if(e) {
     byte[] data=z.getInputStream(e).bytes;File extracted=new File(output,'owner-'+name+'.class')
     if(extracted.exists()) assert sha(extracted.bytes)==sha(data) else extracted.bytes=data
     owners[name]<<[container:f.canonicalPath,file:extracted.canonicalPath,sha256:sha(data)]
    } } }
   }
  }
  ownerNames.each {assert owners[it].size()==1 : 'native owner ambiguous: '+it}
  def record=[schema:4,task:':app:eightPrepare',appBuildDirectory:layout.buildDirectory.get().asFile.canonicalPath,classpath:inventory,classpathString:cp.collect {it.canonicalPath}.join(File.pathSeparator),
    owners:owners.collectEntries {k,v->[k,v[0]]},opencvAar:resolved.aar.canonicalPath,opencvClasses:resolved.classes.canonicalPath,
    opencvNormalization:resolved.normalization,agpResources:resolved.agpResources,sourceSha:cfg.sourceSha]
  if(stage=='prepare') {
   assert cfg.phase=='prepare' && !prepared.exists() : 'immutable preparation baseline must be fresh'
   writeJson(prepared,record)
  } else {
   assert stage in ['runtime-prepare','runtime-before-fork'] && cfg.phase=='run'
   assert sha(prepared.bytes)==cfg.preparedSha256 : 'enriched preparation baseline changed'
   def baseline=new JsonSlurper().parse(prepared)
   assert record==baseline.findAll { k,v -> record.containsKey(k) } : 'actual ordered runtime classpath/owners differ from baseline'
   File observed=new File(output,stage+'.json');assert !observed.exists() : 'runtime capture already exists'
   writeJson(observed,record)
  }
  record
 }
 tasks.register('eightPrepare') {
  // Same actual app/test compilation; no ordinary Test execution, old photographic oracle,
  // instrumentation APK, Android native build or original gate substitution requested.
  // Resolve dependencies during graph construction, never in projectsEvaluated.
  def ordinary=ordinaryProvider.get()
  dependsOn { ordinary.taskDependencies.getDependencies(ordinary) }
  dependsOn(tasks.getByName('verifyHostIntegrationSdk'))
  doLast {capture(cfg.phase=='prepare' ? 'prepare' : 'runtime-prepare')}
 }
 tasks.register('eightProbe', org.gradle.api.tasks.testing.Test) {
  dependsOn(tasks.getByName('eightPrepare'))
  // Read the task directly under normal task configuration, not a mapped provider
  // (which would add the ordinary HOST Test as a producer and run its oracle).
  testClassesDirs=hostProvider.get().testClassesDirs
  classpath=files(provider { actualClasspath(false).cp })
  setExcludes([]) // Override ONLY this explicit narrow task's blanket HOST exclusion.
  include experiment.include
  filter {includeTestsMatching experiment.selector;failOnNoMatchingTests=true}
  maxParallelForks=1;forkEvery=1;maxHeapSize='1g';timeout=java.time.Duration.ofSeconds(300)
  File runtimeCwd=new File(output,'runtime-cwd');File runtimeTmp=new File(output,'runtime-tmp')
  runtimeCwd.mkdirs();runtimeTmp.mkdirs()
  workingDir=runtimeCwd
  systemProperty 'java.io.tmpdir',runtimeTmp.canonicalPath
  jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED','-XX:ActiveProcessorCount=2'
  systemProperty 'robolectric.offline','true';systemProperty 'robolectric.usePreinstrumentedJars','false'
  systemProperty 'robolectric.dependency.dir',new File(project.buildDir,'robolectric-sdk').canonicalPath
  systemProperty 'rf.decoder.fixtureDir',cfg.observations
  systemProperty 'rf.eight.evidenceDir',new File(output,'measurement').canonicalPath
  reports.junitXml.outputLocation=new File(output,'xml');reports.html.required=false
  doFirst {
   assert excludes.isEmpty();assert cfg.phase=='run' && cfg.capability && cfg.capabilitySha256
   File cap=new File(cfg.capability);assert sha(cap.bytes)==cfg.capabilitySha256
   def manifest=new JsonSlurper().parse(cap)
   assert manifest.sourceSha==cfg.sourceSha && manifest.policySha256==cfg.policySha256
   def record=capture('runtime-before-fork')
   assert classpath.files.collect {it.canonicalPath}==record.classpath.collect {it.path} : 'Actual Test classpath differs from captured projection'
   systemProperty 'java.library.path',cfg.aliasDir
   systemProperty 'rf.loader.aliasDir',cfg.aliasDir
   systemProperty 'rf.loader.capabilityManifest',cfg.capability
   systemProperty 'rf.loader.capabilitySha256',cfg.capabilitySha256
   systemProperty 'rf.loader.sourceSha',cfg.sourceSha
   assert manifest.producer.runOwner==cfg.runOwner
   systemProperty 'rf.loader.runOwner',cfg.runOwner
   systemProperty 'rf.loader.workDir',output.canonicalPath
   systemProperty 'rf.loader.policySha256',cfg.policySha256
   manifest.native.each {k,v->assert sha(new File(v.path).bytes)==v.sha256;systemProperty "rf.loader.${k}",v.path}
   record.owners.each {k,v->systemProperty "rf.loader.classSha.${k}",v.sha256}
   assert runtimeCwd.list().length==0 && runtimeTmp.list().length==0 : 'fresh truth-free runtime cwd/tmp required'
   File events=new File(output,'test-events.jsonl');assert !events.exists()
   File evidence=new File(output,'measurement');assert evidence.isDirectory() && evidence.list().length==0
   writeJson(new File(output,'effective-test-config.json'),[selector:cfg.selector,classpath:record.classpath,jvmArgs:allJvmArgs,
      excludes:excludes,includes:includes,workingDir:workingDir.canonicalPath,javaTmpDir:runtimeTmp.canonicalPath,environmentPolicy:'inherited runtime sanitizer and JVM environment unchanged'])
  }
  beforeTest { d -> new File(output,'test-events.jsonl') << JsonOutput.toJson([event:'start',class:d.className,method:d.name])+'\n' }
  afterTest { d,r -> new File(output,'test-events.jsonl') << JsonOutput.toJson([event:'finish',class:d.className,method:d.name,result:r.resultType.toString()])+'\n' }
 }
