name: Prepare checksum-verified M16 source blobs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-tested-source.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact tested source and publish unreferenced blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'cheshmakzanoon-ops/3d-scanner'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          base = 'd17ff730900b944505314ccb4abf1d8092feaec7'
          target = 'c66e58ab33e1afdc0d2cfea06866f5b4ed66c7d1'
          payload = ''.join(pathlib.Path(f'.github/m16-source-{i}.b64').read_text() for i in range(1, 4))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4fc305b6079f96e70fcc0742df9062c15ea4068e9b6ed9d4291b29cb72b8573d'
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          assert git('rev-parse', 'HEAD^').decode().strip() == base
          git('reset', '--hard', base)
          git('apply', '--index', '--whitespace=error', '-', data=patch)
          paths = sorted(set(git('ls-files', '-z').decode().split('\0')) - {'', 'SOURCE_MANIFEST.sha256'})
          manifest = ''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() + '  ' + p + '\n' for p in paths)
          pathlib.Path('SOURCE_MANIFEST.sha256').write_text(manifest)
          git('add', 'SOURCE_MANIFEST.sha256')
          assert git('write-tree').decode().strip() == target, 'Source differs from validated tree'
          changed = git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0')
          assert len(changed) == 17
          entries = []
          for path in changed:
              content = git('show', ':' + path)
              local_blob = git('rev-parse', ':' + path).decode().strip()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs',
                  data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(),
                  method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == local_blob
              mode = git('ls-files', '-s', '--', path).decode().split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          report = {'base': base, 'tree': target, 'files': entries, 'branch_updated': False}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'prepared-blobs.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-tested-source
          path: ${{ runner.temp }}/prepared-blobs.json
          retention-days: 2
