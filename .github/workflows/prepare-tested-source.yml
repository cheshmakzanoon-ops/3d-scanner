name: Prepare checksum-verified M14 source tree
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-tested-source.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reconstruct tested source and publish unreferenced Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'cheshmakzanoon-ops/3d-scanner'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          base = '2d2ceec5a8e7d946ad4263760bba7eb8fe6982dd'
          base_tree = '5ea0a07c0a4ed815161bdf8078b9653ba1b3627d'
          target = '82a55075fe1676a1eebe2fda03a82c01dcfaea38'
          payload = ''.join(pathlib.Path(f'.github/m14-source-{i}.b64').read_text() for i in range(1, 4))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a023a3c36c7952b6f24ea1706b4e1f8812d5f3186e59681b6ab8354948b152d0'
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          assert git('rev-parse', 'HEAD^').decode().strip() == base
          git('reset', '--hard', base)
          git('apply', '--index', '--whitespace=error', '-', data=patch)
          paths = sorted(set(git('ls-files', '-z').decode().split('\0')) - {'', 'SOURCE_MANIFEST.sha256'})
          manifest = ''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() + '  ' + p + '\n' for p in paths)
          pathlib.Path('SOURCE_MANIFEST.sha256').write_text(manifest)
          git('add', 'SOURCE_MANIFEST.sha256')
          assert git('write-tree').decode().strip() == target, 'Source differs from tested tree'
          changed = git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0')
          assert len(changed) == 18
          def post(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/' + endpoint,
                  data=json.dumps(data).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for path in changed:
              content = git('show', ':' + path)
              local_blob = git('rev-parse', ':' + path).decode().strip()
              blob = post('blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              assert blob['sha'] == local_blob
              mode = git('ls-files', '-s', '--', path).decode().split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          result = post('trees', {'base_tree': base_tree, 'tree': entries})
          assert result['sha'] == target
          report = {'base': base, 'tree': result['sha'], 'files': len(entries), 'branch_updated': False}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'prepared-tree.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-tested-source
          path: ${{ runner.temp }}/prepared-tree.json
          retention-days: 2
