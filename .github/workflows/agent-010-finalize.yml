name: Finalize Agent 010 receipt

on:
  push:
    branches: [agents/010-diagnostics-contract]
    paths:
      - docs/agents/status/010.md

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize receipt and source manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum docs/agents/status/010.md | awk '{print $1}')" = "6af3ac47c32a4270cf0d5b6829b5ae3f4a0dbe2330bf9c50655d42ba07703a04"
          git rm .github/workflows/agent-010-finalize.yml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          rows = []
          raw = subprocess.check_output(['git', 'ls-files', '--stage', '-z'])
          for record in raw.split(b'\0'):
              if not record:
                  continue
              metadata, path_bytes = record.split(b'\t', 1)
              _mode, blob_sha, stage = metadata.split()
              if stage != b'0' or path_bytes == b'SOURCE_MANIFEST.sha256':
                  continue
              data = subprocess.check_output(['git', 'cat-file', 'blob', blob_sha.decode('ascii')])
              path = path_bytes.decode('utf-8')
              rows.append((path, hashlib.sha256(data).hexdigest()))
          rows.sort(key=lambda item: item[0])
          Path('SOURCE_MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {path}\n' for path, digest in rows),
              encoding='utf-8',
          )
          PY
          test "$(sha256sum SOURCE_MANIFEST.sha256 | awk '{print $1}')" = "e5620cb3a139adfa528674bafd0f7ee8da059506cb2cf1c0cc7a5b9b9a32662f"
          test "$(git hash-object docs/agents/status/010.md)" = "27844d62c0fb2d75f6b40261132a56e8d11e7b46"
          test "$(git hash-object SOURCE_MANIFEST.sha256)" = "5ff32a83df851d067c7efffc8853352d6c50ce6c"
          git add SOURCE_MANIFEST.sha256
          git diff --cached --check
      - name: Commit final receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RealityForge Agent 010'
          git config user.email 'agent-010@users.noreply.github.com'
          git commit -m 'docs(agent-010): record acceptance evidence and blockers'
          git push origin "HEAD:${GITHUB_REF_NAME}"
