name: Agent 017 Android gate

on:
  push:
    branches:
      - agents/017-capture-overlap-guidance
    paths:
      - ".github/workflows/agent017-android-gate.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build, test and lint exact Agent 017 source
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Validate debug APK
        run: python3 tools/check_apk.py app/build/outputs/apk/debug/app-debug.apk --sdk "$ANDROID_HOME" --report reports/apk-validation-agent017.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent017-android-gate
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
            reports/apk-validation-agent017.json
      - name: Remove one-use workflow after success
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent017-android-gate.yml
          git config user.name "agent-017"
          git config user.email "agent-017@users.noreply.github.com"
          git add -A
          git commit -m "chore(agent-017): record successful Android gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
