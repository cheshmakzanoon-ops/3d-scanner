name: LSan lifecycle diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lsan-boundary-diagnostic.yml'
      - 'tools/qa/lsan_diagnostic/**'
permissions:
  contents: read
concurrency:
  group: lsan-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # existing repository pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # existing repository pin
        with:
          python-version: '3.12'
      - name: Install official host compiler packages
        run: sudo apt-get update && sudo apt-get install -y gcc g++ clang libclang-rt-dev
      - name: Install existing hashed dependency resolution
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.lock
      - name: Validate synthetic classifier and process contracts
        run: cd tools/qa/lsan_diagnostic && python -m unittest -v test_contract
      - name: Run bounded lifecycle proof (not production policy)
        shell: bash
        env:
          PROOF_COMPILER: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          CC="$(command -v "$PROOF_COMPILER")"
          if [ "$PROOF_COMPILER" = gcc ]; then
            ASAN="$($CC -print-file-name=libasan.so)"
          else
            ASAN="$($CC -print-file-name=libclang_rt.asan-x86_64.so)"
          fi
          CXX="$(g++ -print-file-name=libstdc++.so)"
          test -f "$ASAN" && test -f "$CXX"
          META="$RUNNER_TEMP/lsan-diagnostic-metadata"
          mkdir -p "$META"
          "$CC" --version > "$META/compiler.txt"
          python --version > "$META/python.txt"
          python -c 'import numpy; print(numpy.__version__)' > "$META/numpy.txt"
          sha256sum tools/requirements.lock tools/qa/lsan_diagnostic/*.py tools/qa/lsan_diagnostic/faults.c > "$META/input-sha256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$META/source-sha.txt"
          timeout --signal=TERM --kill-after=10s 600s python tools/qa/lsan_diagnostic/run_matrix.py \
            --compiler "$CC" --runtime "$ASAN" --cxx-runtime "$CXX" \
            --lock tools/requirements.lock --python "$(command -v python)" --output "$RUNNER_TEMP/lsan-diagnostic"
      - name: Require real fault diagnostics; reject infrastructure failures
        if: always()
        run: python tools/qa/lsan_diagnostic/classify.py "$RUNNER_TEMP/lsan-diagnostic"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # existing repository pin
        if: always()
        with:
          name: lsan-diagnostic-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lsan-diagnostic/*.log
            ${{ runner.temp }}/lsan-diagnostic/*.json
            ${{ runner.temp }}/lsan-diagnostic-metadata/*.txt
          if-no-files-found: error
          retention-days: 3
