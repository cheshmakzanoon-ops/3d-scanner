name: Verify RealityForge
on:
  push:
    branches: [main, 'agents/**', 'integration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev ninja-build
      - name: Install approved hash-locked host wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.lock
      - name: Bind native run to exact source
        run: |
          python tools/source_manifest.py verify --source HEAD
          python tools/ci/validation/evidence.py begin --gate native --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/rf-ci/native/start.json"
      - name: Install pinned QA-only interchange and security tools
        run: python tools/dependencies/install_qa.py --root "$RUNNER_TEMP/rf-qa" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH" --require-portable-blender
      - name: Execute Agent 081 compiler, sanitizer, numerical and real-image gates
        run: python tools/qa/native_regression/run.py --output "$RUNNER_TEMP/rf-ci/native/runner"
      - name: Validate native completion and seal exact artifacts
        run: python tools/ci/validation/evidence.py collect --start "$RUNNER_TEMP/rf-ci/native/start.json" --native-record "$RUNNER_TEMP/rf-ci/native/runner/evidence.json" --artifact "$RUNNER_TEMP/rf-qa/installation.json" --artifact "$RUNNER_TEMP/rf-qa/*-install.log" --artifact "$RUNNER_TEMP/rf-qa/*-check.log" --artifact "$RUNNER_TEMP/rf-qa/downloads/blender-publisher.sha256" --output "$RUNNER_TEMP/rf-ci/native/sealed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rf-evidence-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rf-ci/native/sealed/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: rf-native-failure-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rf-ci/native/start.json
            ${{ runner.temp }}/rf-qa/installation.json
            ${{ runner.temp }}/rf-qa/*.log
            ${{ runner.temp }}/rf-qa/downloads/blender-publisher.sha256
            ${{ runner.temp }}/rf-ci/native/runner/evidence.json
            ${{ runner.temp }}/rf-ci/native/runner/**/*.log
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Bind Android run to exact source
        run: |
          python tools/source_manifest.py verify --source HEAD
          python tools/ci/validation/evidence.py begin --gate android --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/rf-ci/android/start.json"
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - run: python tools/check_apk.py app/build/outputs/apk/debug/app-debug.apk --sdk "$ANDROID_HOME" --report "$RUNNER_TEMP/rf-ci/android/apk-validation.json"
      - name: Validate actual JVM reports, APKs and lint evidence
        run: >-
          python tools/ci/validation/evidence.py collect --start "$RUNNER_TEMP/rf-ci/android/start.json"
          --junit 'app/build/test-results/testDebugUnitTest/TEST-*.xml'
          --artifact 'app/build/outputs/apk/**/*.apk' --artifact app/build/reports/lint-results-debug.xml
          --apk-report "$RUNNER_TEMP/rf-ci/android/apk-validation.json" --output "$RUNNER_TEMP/rf-ci/android/sealed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rf-evidence-android-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rf-ci/android/sealed/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: app/build/reports/
          if-no-files-found: error
  device:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Bind emulator run to candidate
        run: python tools/ci/validation/evidence.py begin --gate device --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/rf-ci/device/start.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Enable KVM for accelerated Android emulation
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/run-device-tests.sh --scope debug --serial emulator-5554 --app-apk "$RUNNER_TEMP/candidate/debug/app-debug.apk" --test-apk "$RUNNER_TEMP/candidate/androidTest/debug/app-debug-androidTest.apk" --expect-api 35 --expect-abi x86_64 --output "$RUNNER_TEMP/rf-ci/device/runner"
      - name: Validate debug compatibility scope and fresh synthetic-session screenshot
        run: >-
          python tools/ci/validation/evidence.py collect --start "$RUNNER_TEMP/rf-ci/device/start.json"
          --artifact "$RUNNER_TEMP/candidate/**/*.apk" --device-record "$RUNNER_TEMP/rf-ci/device/runner/compatibility.json"
          --screenshot "$RUNNER_TEMP/rf-ci/device/runner/photographic-viewer.png" --output "$RUNNER_TEMP/rf-ci/device/sealed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rf-evidence-device-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rf-ci/device/sealed/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-execution-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rf-ci/device/runner/
          if-no-files-found: error
  candidate-evidence:
    if: always()
    needs: [native, android, device]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require every runtime job to execute successfully
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json, os; assert all(x["result"] == "success" for x in json.loads(os.environ["JOB_RESULTS"]).values()), "Required job failed, skipped or cancelled"'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rf-evidence-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
      - name: Verify complete exact-candidate evidence
        run: |
          python tools/source_manifest.py verify --source HEAD
          python tools/ci/validation/evidence.py verify --directory "$RUNNER_TEMP/evidence" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/candidate-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-evidence.json
          if-no-files-found: error
