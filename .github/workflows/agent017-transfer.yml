name: Agent 017 source transfer

on:
  push:
    branches:
      - agents/017-capture-overlap-guidance
    paths:
      - ".agent017-transfer/**"
      - ".github/workflows/agent017-transfer.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract Agent 017 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .agent017-transfer/chunk-*.b64 > /tmp/agent017.tar.gz.b64
          base64 --decode /tmp/agent017.tar.gz.b64 > /tmp/agent017.tar.gz
          echo "27e0b817e71c9b249537d19d3ac9e13c55dcf6d126efb4992c10b949054a0773  /tmp/agent017.tar.gz" | sha256sum --check -
          tar -xzf /tmp/agent017.tar.gz
          rm -rf .agent017-transfer
          rm .github/workflows/agent017-transfer.yml
      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agent-017"
          git config user.email "agent-017@users.noreply.github.com"
          git add -A
          git commit -m "feat(capture): add measured overlap guidance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
