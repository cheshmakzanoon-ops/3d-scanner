name: Agent 017 source transfer

on:
  push:
    branches:
      - agents/017-capture-overlap-guidance
    paths:
      - ".agent017-transfer/**"
      - ".github/workflows/agent017-transfer.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract Agent 017 source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          encoded = b"".join(
              path.read_bytes()
              for path in sorted(Path(".agent017-transfer").glob("chunk-*.b64"))
          )
          archive = base64.b64decode(encoded, validate=True)
          expected = "27e0b817e71c9b249537d19d3ac9e13c55dcf6d126efb4992c10b949054a0773"
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit(f"archive checksum mismatch: {actual}")
          Path("/tmp/agent017.tar.gz").write_bytes(archive)
          PY
          tar -xzf /tmp/agent017.tar.gz
          rm -rf .agent017-transfer
          rm .github/workflows/agent017-transfer.yml
      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agent-017"
          git config user.email "agent-017@users.noreply.github.com"
          git add -A
          git commit -m "feat(capture): add measured overlap guidance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
