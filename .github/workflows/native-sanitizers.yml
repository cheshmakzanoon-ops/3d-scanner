name: Native numerical and sanitizer matrix
on:
  # Verify owns main/development-branch pushes and all PRs. Preserve native
  # coverage on other push branches without duplicating the authoritative gate.
  push:
    branches-ignore: [main, 'agents/**', 'integration/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        config: [gcc-release, clang-release, gcc-sanitize, clang-sanitize]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-dev
      - name: Install approved hashed host resolution
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.lock
      - name: Prepare pinned full-suite QA tools
        run: python tools/dependencies/install_qa.py --root "$RUNNER_TEMP/rf-qa" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH" --require-portable-blender
      - name: Compile and execute current native implementation
        run: python tools/qa/native_regression/run.py --configs '${{ matrix.config }}' --output '${{ runner.temp }}/native-${{ matrix.config }}' --pytest-timeout ${{ endsWith(matrix.config, '-sanitize') && 1800 || 600 }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ matrix.config }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-${{ matrix.config }}
          retention-days: 14
