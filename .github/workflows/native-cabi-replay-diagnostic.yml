name: Supplementary native C ABI replay diagnostic (not release qualification)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-cabi-replay-diagnostic.yml
      - tools/qa/native_cabi_replay/**
      - tools/qa/python_lsan_comparison/control.c
      - tests/test_native_cabi_replay.py
      - tests/test_pipeline.py
      - tools/benchmark_middlebury.py
      - tools/benchmark_surface_middlebury.py
      - tools/benchmark_texture_middlebury.py
      - tools/native_api.py
      - tools/requirements.lock
      - CMakeLists.txt
      - reconstruction/**
permissions:
  contents: read
concurrency:
  group: native-cabi-replay-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  supplementary-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official GCC13 native tools
        run: |
          timeout --signal=TERM --kill-after=10s 120s sudo apt-get update
          timeout --signal=TERM --kill-after=10s 180s sudo apt-get install -y gcc-13 g++-13 cmake ninja-build zlib1g-dev
      - name: Install existing hashed host dependency resolution
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.lock
      - name: Test diagnostic guards, including optimized Python
        run: python -m pytest -q tests/test_native_cabi_replay.py
      - name: Ordinary-exit native ASan+UBSan replay with positive leak control
        run: python -m tools.qa.native_cabi_replay.run --config sanitize --compiler g++-13 --output "$RUNNER_TEMP/native-cabi-replay" --timeout 600
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supplementary-native-cabi-replay-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-cabi-replay/receipt.json
            ${{ runner.temp }}/native-cabi-replay/*.log
            ${{ runner.temp }}/native-cabi-replay/inputs/manifest.json
            ${{ runner.temp }}/native-cabi-replay/results/
          if-no-files-found: error
          retention-days: 7
