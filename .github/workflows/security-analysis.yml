name: Offline input and security assurance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m venv /tmp/rf-security
      - run: /tmp/rf-security/bin/pip install -r tools/security/requirements-lock.txt
      - run: python -m pytest -q tests/test_capture_audit.py tests/test_security_evidence.py
        env:
          RF_SECURITY_PYTHON: /tmp/rf-security/bin/python
      - run: python tools/security/scan.py tools --scanner-python /tmp/rf-security/bin/python --requirements tools/requirements-real-benchmark.txt --suppressions tools/security/suppressions-v1.json --output reports/security/redacted.json
