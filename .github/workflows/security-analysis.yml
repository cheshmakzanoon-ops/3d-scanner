name: Offline input and security assurance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tools/requirements.lock
      - run: python -m venv /tmp/rf-security
      - run: /tmp/rf-security/bin/pip install --require-hashes -r tools/dependencies/security-requirements.lock
      - run: python -m pytest -q tests/test_capture_audit.py tests/test_security_evidence.py
        env:
          RF_SECURITY_PYTHON: /tmp/rf-security/bin/python
      - name: Audit every resolved host lock against the exact candidate
        run: |
          result=0
          for lock in tools/requirements.lock tools/dependencies/qa-requirements.lock tools/dependencies/security-requirements.lock; do
            name=$(basename "$lock")
            if ! python tools/security/scan.py tools --source-sha "$GITHUB_SHA" --scanner-python /tmp/rf-security/bin/python --requirements "$lock" --suppressions tools/security/suppressions-v1.json --output "$RUNNER_TEMP/security/$name.json"; then
              result=1
            fi
          done
          exit "$result"
      - name: Retain redacted findings and all counters on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redacted-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security/
          if-no-files-found: error
