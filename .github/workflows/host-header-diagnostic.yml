name: Focused HOST header admission diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/host-header-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: host-header-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  header-admission:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'cheshmakzanoon-ops/3d-scanner' &&
          github.event.repository.full_name == 'cheshmakzanoon-ops/3d-scanner' &&
          toJSON(github.event.repository.private) == 'false' &&
          github.event.repository.default_branch == 'main' &&
          github.ref == 'refs/heads/main' && github.event.ref == 'refs/heads/main' &&
          github.event.before == '25a0176d7cd93ba451932cf65b016331ca13038b' && github.event.after == github.sha &&
          github.event.head_commit.id == github.sha &&
          github.event.head_commit.message == 'test: inventory host header escapes once' &&
          toJSON(github.event.created) == 'false' && toJSON(github.event.deleted) == 'false' &&
          toJSON(github.event.forced) == 'false' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Inventory fixed header-link metadata (no snapshot or qualification)
        run: python3 -B -m tools.eight_view_host.header_diagnostic
      - name: Retain bounded original admission failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-header-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rf-header-evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: false
