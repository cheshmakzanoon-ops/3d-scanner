              dataset_identity: 11 deterministic in-memory source/provider fault fixtures
              evidence: https://github.com/cheshmakzanoon-ops/3d-scanner/actions/runs/39186487826
            - criterion: successful exports preserve exact expected bytes and SHA-256 and cannot switch project, artifact or revision after picker binding
