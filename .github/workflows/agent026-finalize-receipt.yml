              dataset_identity: repository Android build, JVM and lint suites
              evidence: https://github.com/cheshmakzanoon-ops/3d-scanner/actions/runs/39187310320
            - criterion: shared SAF DocumentsProvider fault matrix including provider process failure and relaunch
              result: BLOCKED_EXTERNAL
              command: ./gradlew :app:connectedDebugAndroidTest
              source_sha: 515bc7e725d0916ba6135d610856e121bcf5ba19
              artifact_sha256: null
              environment: Agent 088 shared FaultDocumentProvider/process controller is not yet available; no authorized emulator or physical provider device was supplied
              dataset_identity: null
              evidence: docs/agents/requests/026-to-088.md
          remaining_work:
            - Agent 001 must bind activity-result callbacks to immutable destination requests.
            - Agents 006, 023, 025 and 067 must connect verified repository artifacts, archives and export orchestration through the published ports.
            - Agent 088 must publish the single shared test-only FaultDocumentProvider/process controller before the connected provider fault matrix can run.
            - Final integrated-candidate and physical document-provider interoperability gates remain open and must not be inferred from host or compile evidence.
          external_blockers:
            - shared Agent 088 FaultDocumentProvider/process controller is not yet available
            - no authorized connected Android emulator or physical document-provider device is available for the required provider fault matrix
          next_action: Agent 100 can integrate commit 515bc7e725d0916ba6135d610856e121bcf5ba19 with the indexed owner requests; rerun connected provider and physical interoperability gates when Agent 088 infrastructure and hardware are available.
          EOF

          rm .github/workflows/agent026-finalize-receipt.yml
          git config user.name "agent-026"
          git config user.email "agent-026@users.noreply.github.com"
          git add -A -- docs/agents/status/026.md .github/workflows/agent026-finalize-receipt.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          records = subprocess.check_output(['git', 'ls-files', '--stage', '-z']).split(b'\0')
          rows = []
          for record in records:
              if not record:
                  continue
              metadata, raw_path = record.split(b'\t', 1)
              mode, oid, stage = metadata.split()
              path = raw_path.decode('utf-8')
              if stage != b'0':
                  raise SystemExit('Resolve all semantic merge conflicts before regenerating the manifest.')
              if path == 'SOURCE_MANIFEST.sha256':
                  continue
              if mode not in (b'100644', b'100755') or '\n' in path or '\r' in path:
                  raise SystemExit('Unsupported tracked entry: ' + path)
              content = subprocess.check_output(['git', 'cat-file', 'blob', oid.decode('ascii')])
              rows.append((path, hashlib.sha256(content).hexdigest()))
          Path('SOURCE_MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {path}\n' for path, digest in sorted(rows)),
              encoding='utf-8',
          )
          PY
          git add SOURCE_MANIFEST.sha256
          git diff --check --cached
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs(agent-026): finalize verified delivery receipt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
