              result: PASS
              command: cmake/ctest/pytest plus gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
              source_sha: 515bc7e725d0916ba6135d610856e121bcf5ba19
              artifact_sha256: null
              environment: GitHub Actions ubuntu-24.04 native and Android jobs
              dataset_identity: repository baseline native, Python, JVM and APK validation suites
              evidence: https://github.com/cheshmakzanoon-ops/3d-scanner/actions/runs/39186487826
            - criterion: exact implementation commit is independently rebuilt by the one-use Android verification workflow
              result: PASS
              command: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
