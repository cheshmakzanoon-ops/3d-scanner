name: Agent 001 materialize verified patch

on:
  push:
    branches:
      - agents/001-app-composition
    paths:
      - .github/workflows/agent001-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-001-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Agent 001 branch
        uses: actions/checkout@v4
        with:
          ref: agents/001-app-composition
          fetch-depth: 0

      - name: Decode and verify staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent001-patch/part-* | base64 --decode > /tmp/agent001.patch.xz
          echo '73ff0ec3ebaa46ed21167af298ac166f19f1dd632ed0c85d42fe75f057796f52  /tmp/agent001.patch.xz' | sha256sum --check --strict
          xz --decompress --stdout /tmp/agent001.patch.xz > /tmp/agent001.patch
          echo 'e7fcd4ee0107ebc89037e42d3f37883b8e35a67e48704821c8113b798edac1e0  /tmp/agent001.patch' | sha256sum --check --strict
          git apply --check /tmp/agent001.patch

      - name: Commit verified Agent 001 implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/agent001.patch
          rm -rf .github/agent001-patch .github/workflows/agent001-materialize.yml
          git add -A
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git commit -m 'feat: bind scanner operations to immutable project identity'
          git push origin HEAD:agents/001-app-composition
