name: Agent 001 materialize verification evidence

on:
  push:
    branches:
      - agents/001-app-composition
    paths:
      - .github/workflows/agent001-evidence-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-001-evidence-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Agent 001 branch
        uses: actions/checkout@v4
        with:
          ref: agents/001-app-composition
          fetch-depth: 0

      - name: Decode and verify staged evidence patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent001-evidence/part-* | base64 --decode > /tmp/agent001-evidence.patch.xz
          echo '3c360da4e7ab9d2d0e7b71041c480773bec27e935eea90b52e10eda5167532f8  /tmp/agent001-evidence.patch.xz' | sha256sum --check --strict
          xz --decompress --stdout /tmp/agent001-evidence.patch.xz > /tmp/agent001-evidence.patch
          echo '96cbcb34e0fae9a535aa358f181f0067bc3d32f0854d8d3cefe5e338befdf877  /tmp/agent001-evidence.patch' | sha256sum --check --strict
          git apply --check /tmp/agent001-evidence.patch

      - name: Commit verified Agent 001 evidence
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/agent001-evidence.patch
          rm -rf .github/agent001-evidence .github/workflows/agent001-evidence-materialize.yml
          git add -A
          git config user.name 'cheshmakzanoon-ops'
          git config user.email 'cheshmakzanoon@gmail.com'
          git commit -m 'docs: record Agent 001 verification and handoffs'
          git push origin HEAD:agents/001-app-composition
