name: Export repository source snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact source tree
        run: python tools/source_manifest.py verify --source HEAD
      - name: Archive exact checked-out revision and prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/source_snapshot/archive.py create --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/source.tar.gz" --record "$RUNNER_TEMP/source.json"
          python tools/ci/source_snapshot/archive.py verify --revision "$GITHUB_SHA" --archive "$RUNNER_TEMP/source.tar.gz" --record "$RUNNER_TEMP/source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realityforge-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
