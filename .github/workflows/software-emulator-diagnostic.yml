name: Focused Android software-emulator experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/software-emulator-diagnostic.yml
      - tools/device/software_emulator/diagnostic.py
permissions:
  contents: read
concurrency:
  group: software-emulator-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-software-runtime:
    # Public standard runners only; no paid runner or persistent artifact/cache storage.
    # One automatic attempt from this reviewed parent; ordinary later pushes cannot re-arm it.
    if: >-
      ${{ toJSON(github.event.repository.private) == 'false' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            github.repository == 'cheshmakzanoon-ops/3d-scanner' &&
            github.event.repository.full_name == 'cheshmakzanoon-ops/3d-scanner' &&
            github.event.repository.default_branch == 'main' &&
            github.ref == 'refs/heads/main' && github.event.ref == 'refs/heads/main' &&
            github.event.before == '89d9e3387bb19e5243017f28461040372615736b' &&
            github.event.after == github.sha && github.event.head_commit.id == github.sha &&
            github.event.head_commit.message == 'test: bound non-UI Android checks on official ATD' &&
            toJSON(github.event.created) == 'false' &&
            toJSON(github.event.deleted) == 'false' &&
            toJSON(github.event.forced) == 'false' && github.run_attempt == '1')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Four focused tests in unsupported CPU software mode (not qualification)
        run: python3 tools/device/software_emulator/diagnostic.py
